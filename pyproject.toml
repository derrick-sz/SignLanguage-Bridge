[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signlanguage-bridge-core"
version = "0.2.0"
description = "Traceable sign-language datasets, reproducible training and standalone inference"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scikit-learn>=1.3,<2", "joblib>=1.3,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]
api = ["fastapi==0.118.0", "uvicorn==0.37.0", "python-multipart==0.0.20", "pydantic>=2.10,<3"]
onnx = ["onnxruntime==1.23.2"]
onnx-gpu = ["onnxruntime-gpu==1.23.2"]
onnx-export = ["onnx==1.19.1", "skl2onnx==1.19.1"]
api-test = ["httpx==0.28.1"]

[project.scripts]
slbridge = "slbridge.cli:main"
slbridge-desktop = "slbridge.desktop_cli:main"
slbridge-api = "slbridge.api_cli:main"

[tool.setuptools.packages.find]
include = ["slbridge*"]

[tool.setuptools.package-data]
slbridge = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

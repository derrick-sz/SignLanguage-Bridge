[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signlanguage-bridge-core"
version = "0.1.0"
description = "Traceable sign-language datasets, reproducible training and standalone inference"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scikit-learn>=1.3,<2", "joblib>=1.3,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
slbridge = "slbridge.cli:main"
slbridge-desktop = "slbridge.desktop_cli:main"

[tool.setuptools.packages.find]
include = ["slbridge*"]

[tool.setuptools.package-data]
slbridge = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

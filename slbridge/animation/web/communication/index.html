<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手语桥 · 样例视频窗口</title><link rel="icon" href="data:,">
<style>html,body{margin:0;width:100%;height:100%;background:#142337;color:#e9eff8;font-family:"Microsoft YaHei",sans-serif}video{width:100%;height:100%;display:block;object-fit:contain}main{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px;text-align:center}h1{font-size:24px}p{font-size:14px;color:#a6bbd3;line-height:1.8;max-width:38ch}button{background:#315de5;color:white;border:0;border-radius:7px;padding:12px 23px;font-size:15px;cursor:pointer}input,[hidden]{display:none!important}a{color:#b6ccff;font-size:12px;margin-top:22px}#error{color:#ffcdb8}</style></head>
<body><video id="sample-video" controls autoplay muted loop playsinline aria-label="已选择的手语样例视频" hidden></video><main id="sample-start"><h1>手语样例视频窗口</h1><p>选择已有视频后，这个标签页只播放该视频。回到会议字幕页，点击共享屏幕并选择这个标签页。</p><button id="choose-sample">选择样例视频</button><input id="sample-file" type="file" accept="video/*" aria-label="选择手语样例视频"><p id="error" role="status"></p><a href="/communicate/" target="_blank" rel="noopener">打开会议字幕</a></main>
<script type="module">
const input=document.getElementById('sample-file'),video=document.getElementById('sample-video');let url=null;
document.getElementById('choose-sample').addEventListener('click',()=>input.click());
input.addEventListener('change',()=>{const file=input.files[0];if(!file)return;if(!file.size||file.size>128*1024*1024){document.getElementById('error').textContent='请选择128MB以内的视频。';return;}if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(file);video.src=url;video.hidden=false;document.getElementById('sample-start').hidden=true;video.play().catch(()=>{});});
video.addEventListener('error',()=>{document.getElementById('sample-start').hidden=false;document.getElementById('error').textContent='视频无法播放，请换用MP4或WebM。';});
window.addEventListener('pagehide',()=>{video.pause();if(url)URL.revokeObjectURL(url);});
</script></body></html>
